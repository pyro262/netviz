[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netviz"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "influxdb-client>=1.44",
    "geoip2>=4.8",
    # The hourly cloud mosaic: NOAA publishes it as netCDF-4, which is HDF5.
    # Both are optional at runtime -- netviz.clouds catches the ImportError and
    # the layer simply never appears -- but they ship by default, because a
    # feature that silently does nothing on a fresh clone is worse than a
    # slightly larger image.
    "h5py>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "playwright>=1.62"]

[tool.setuptools.dynamic]
version = {attr = "netviz.__version__"}

[tool.setuptools.packages.find]
include = ["netviz*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
