<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Kills the white flash on the self-reload. The browser paints the base
         canvas before any CSS is parsed, and its default is white -- on a dark
         wall display that is a full-screen strobe every time /build.json
         changes. `background: #0b0916` below is too late to prevent it; this
         meta is read first and makes the pre-CSS canvas dark. -->
    <meta name="color-scheme" content="dark">
    <title>netviz</title>
    <!-- PNGs only, deliberately. Chrome prefers an SVG icon at every size, and
         the detailed mark (meridian grid, three arcs) is mush in a 16px tab.
         icon.svg / icon-512.png stay in the tree for anything that wants the
         full drawing. Regenerate all four with tools/make_icon.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <style>
      :root {
        color-scheme: dark;
        /* ONE number, two readers: the tuning panel's width and the slice it
           takes out of #stage. Written here rather than twice, because the two
           disagreeing is a panel that either overlaps the globe or floats over
           a gap. Fixed pixels, unlike the right rail's 26%: the panel's rows
           are label + slider + typed number, which have a real minimum legible
           width, so a percentage would be unreadable at 1280 and wasteful at
           4K.

           CLAMPED, and the clamp is load-bearing -- do not remove it as
           redundant. Pixels do not know how big the viewport is, so an
           unclamped 380px slice is 380px of WHATEVER is there: at a 420px
           window the stage is 40px and the camera runs at aspect 0.055, and at
           380px or narrower the stage is zero-width and the display is BLANK
           until the panel is closed. The right rail cannot do that to itself
           because 26% is self-limiting. Below the clamp the panel is cramped,
           which is the trade taken deliberately: a cramped panel beside a
           globe beats a blank wall. verify_tuner.py case 7 is the proof, at
           420x800. */
        --tuner-width: min(380px, 45vw);
        /* The theme panel's own copy of the same number, for the same
           reason: it is a LEFT RAIL too (see js/theme_panel.js), and never
           open at the same time as the tuning panel -- the menu enforces
           mutual exclusion between all three panels -- so the two rails
           never have to share a viewport. A separate custom property rather
           than reusing --tuner-width because the two panels are allowed to
           diverge in width later without one silently resizing the other. */
        --theme-panel-width: min(380px, 45vw);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0916; }
      /* The canvas sizes itself to #stage, not to the window, so the optional
         rails can take a slice of the viewport without the globe rendering
         off-center. With both off, #stage IS the viewport. */
      #stage { position: fixed; inset: 0; }
      body.rail #stage { right: 26%; }
      body.tuner #stage { left: var(--tuner-width); }
      body.theme #stage { left: var(--theme-panel-width); }
      /* width/height belt-and-braces against renderer.setSize's updateStyle:
         without a CSS size the canvas lays out at its intrinsic pixel size,
         which is viewport * devicePixelRatio -- correct only at dpr 1. */
      canvas { display: block; width: 100%; height: 100%; transition: filter 1.6s ease; }
      /* Required, and required in CSS rather than JS: without it the browser
         scrolls the page out from under a drag on a tablet before any handler
         runs. */
      canvas { touch-action: none; }
      /* An arrow parked on a dark wall for a week is the most visible thing in
         the room. */
      canvas.cursor-hidden { cursor: none; }
      /* Degraded: drain the color out of the whole scene in one move --
         arcs, city lights and bloom included -- so a dead feed cannot be
         mistaken for a quiet night. */
      body.degraded canvas { filter: grayscale(0.88) brightness(0.62); }
      #degraded {
        position: fixed; top: 0; left: 0; right: 0; z-index: 2;
        display: none;
        padding: 0.6rem 1.2rem;
        background: #fb9f3a;            /* plasma #fb9f3a */
        color: #17122b;
        font: 600 clamp(18px, 2.1vw, 40px)/1.2 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-align: center;
      }
      #degraded.on { display: block; }

      /* ---------------------------------------------------- the right rail --
         Off unless turned on from the on-screen menu -- see js/rail.js.
         Nothing below applies to a default kiosk, and #rail stays empty and
         undisplayed. Sizes are in vw so the rail reads the same on a 1080p
         desk monitor and a 4K wall. */
      #rail {
        position: fixed; top: 0; right: 0; bottom: 0; width: 26%;
        display: none; flex-direction: column; gap: 1.4vh;
        box-sizing: border-box; padding: 1.6vh 1.4vw;
        background: #12102400;         /* transparent-backed, per the design */
        color: #fdca26;                /* plasma */
        font: 400 1.05vw/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        /* Degraded mode fades the stats out over 2s (the canvas drain next to
           it takes 1.6s) rather than blanking them: the last known numbers are
           what someone walking up to a dead feed wants to see. */
        transition: opacity 2s ease;
        /* THE SAFETY NET, NOT THE SOLUTION. rail.js's fitRuleCap drops the rule
           rows that do not fit and names them ("+N more"), because nobody is
           standing at a wall display to scroll it -- content below the fold is
           invisible for ever. This catches what fitting cannot: a very short
           viewport, or a browser zoomed in, where even one rule row plus the
           fixed panels exceeds the height. Before both, the rail had no
           overflow property at all, so content simply spilled off the bottom of
           the screen with no scrollbar and no way to reach it -- measured, 502px
           of it at 20 rules on 2560x1440.
           `scrollbar-gutter: stable` is not cosmetic: without it the scrollbar
           appearing narrows the rail, which rewraps the labels, which changes
           the row height the fitter just measured. */
        overflow-y: auto; scrollbar-gutter: stable;
        scrollbar-width: thin; scrollbar-color: #7201a8 transparent;
      }
      #rail.on { display: flex; }
      body.degraded #rail { opacity: 0.28; }

      .rail-head { display: flex; align-items: baseline; justify-content: space-between; }
      .rail-title { font-size: 1.5vw; font-weight: 600; color: #f0f921; letter-spacing: 0.18em; }
      .rail-clock { text-align: right; color: #d8576b; }
      .rail-clock-local { font-size: 1.35vw; color: #fdca26; }
      .rail-clock-utc { font-size: 0.85vw; opacity: 0.7; }

      /* The collector's build, bottom right. margin-top:auto pushes it to the
         foot of the flex column whatever the panels above it are doing, and it
         is deliberately the dimmest thing on the rail: useful when you go
         looking for it, invisible when you are not. */
      .rail-foot {
        margin-top: auto; text-align: right;
        font-size: 0.8vw; opacity: 0.45; letter-spacing: 0.1em;
      }

      .rail-panel { border-top: 1px solid #7201a855; padding-top: 0.9vh; }
      .rail-panel-title {
        margin: 0 0 0.5vh; font-size: 0.9vw; font-weight: 600;
        letter-spacing: 0.22em; color: #ed7953;
      }
      .rail-panel-note { margin-left: 0.6em; opacity: 0.6; }

      .rail-big { display: flex; align-items: baseline; gap: 0.6vw; margin-bottom: 0.6vh; }
      .rail-big-value { font-size: 3.1vw; line-height: 1; color: #fdca26; }
      .rail-big-note { font-size: 0.8vw; letter-spacing: 0.18em; color: #d8576b; }

      /* Two shapes. A plain row is label + right-aligned value. A row with a
         bar puts the bar last and lets it take the slack, so the country codes
         and their counts stay in fixed columns while only the bar changes
         width. Both keep the label column the same, so the two panels read as
         one list. */
      .rail-row {
        display: grid; grid-template-columns: 1fr auto; gap: 0.6vw;
        align-items: center; padding: 0.18vh 0;
      }
      /* The block rows carry a fourth column: the last hour as a sparkline.
         Fixed width rather than a second 1fr, so the 24h bar keeps the space
         it had and the two do not trade width as counts change. */
      .rail-row.bars { grid-template-columns: 3.2em auto 1fr 4.5em; }
      .rail-row.muted { opacity: 0.45; }
      .rail-label { color: #bd3786; }
      .rail-value { color: #fdca26; text-align: right; font-variant-numeric: tabular-nums; }
      .rail-value.bad { color: #fb9f3a; font-weight: 600; }
      .rail-bar { display: block; height: 0.55vh; background: #46039f55; }
      .rail-bar-fill { display: block; height: 100%; background: #ed7953; }
      /* Dimmer than the bar it sits beside: the day's ranking is the headline
         and the hour's shape is the qualifier. vector-effect keeps the stroke
         1px after the viewBox is stretched to the column -- without it the
         non-uniform scale turns the line into a wedge. */
      /* Update watermark, lower left. Deliberately not the alarm amber: an
         available update is not an alarm, and spending that color on one
         devalues it where it matters. Violet is the map's own hue, so this
         reads as part of the furniture rather than as an event.

         pointer-events:none because the wall has no interaction at all and a
         stray element that could swallow one would be a bug nobody looks for.
         It transitions opacity only -- transitioning `display` or `visibility`
         does nothing, and the fade is the whole point. */
      .update-mark {
        position: fixed; left: 1.6vw; bottom: 1.4vh; z-index: 3;
        font-size: 0.85vw; letter-spacing: 0.18em;
        color: #b39ddb; opacity: 0;
        transition-property: opacity; transition-timing-function: ease;
        pointer-events: none; user-select: none;
      }
      /* Two animations, not one: a single looping animation cannot also do a
         one-time fade-in. `update-in` runs once and holds its end state with
         `forwards`, then `update-breathe` starts after the same 2s and wins
         the property from then on, because the later of two active animations
         on one property is the one that applies.

         7s and ease-in-out: slow enough that it never reads as a blink or a
         flicker, and far off the cadence of anything else on the display, so
         it does not sync with arc or ripple motion. It is the only thing here
         that breathes, which is what makes peripheral vision find it. */
      @keyframes update-in { from { opacity: 0; } to { opacity: 0.32; } }
      @keyframes update-breathe {
        0%   { opacity: 0.20; }
        50%  { opacity: 0.52; }
        100% { opacity: 0.20; }
      }
      .update-mark.on {
        opacity: 0.32;
        animation: update-in 2s ease forwards,
                   update-breathe 7s ease-in-out 2s infinite;
      }
      /* Someone who has asked the system for less motion gets the mark, still
         legible, without the pulse -- the information is the point and the
         movement is only how it is found. */
      @media (prefers-reduced-motion: reduce) {
        .update-mark.on { animation: update-in 2s ease forwards; opacity: 0.32; }
      }
      /* Degraded mode already drains the canvas to grey; the watermark is not
         part of that story and steps further back rather than competing with
         the banner that is. */
      body.degraded .update-mark.on { opacity: 0.16; }
      #rail .rail-swatch { display:inline-block; width:8px; height:8px; border-radius:2px;
                           margin-right:6px; vertical-align:middle; }
      /* The legend's swatch is the legend. It carries the whole message --
         the label says what the arc means, never what color it is -- so it
         is a chip rather than a dot, sized to read from across a room. Keyed
         off the ROW, not its panel: the two legend rows sit at the top of the
         CUSTOM ARCS panel among rows that keep the small dot. */
      #rail .rail-swatch.big { width: 26px; height: 12px; border-radius: 3px;
                               margin-right: 9px; }
      /* A muted row dims its TEXT, never its swatch. The swatch is a sample of
         a color that is on the globe right now, and a sample shown at 45%
         opacity is a different color -- the one thing a key must not be. */
      .rail-row.muted .rail-swatch { opacity: 1; }
      .rail-spark { display: block; width: 100%; height: 1.4vh; overflow: visible; }
      .rail-spark polyline {
        fill: none; stroke: #ed795399; stroke-width: 1;
        stroke-linejoin: round; stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      /* ------------------------------------------------------------ the menu --
         Opened by right-click, `s`, or a double tap (js/menu.js + a later
         task's wiring); closed by an outside click, the opening gesture
         repeated, a successful action, esc, or the page losing focus.

         Deliberately its OWN palette, not the wall's plasma scheme: it has to
         stay readable whatever the display is doing underneath it -- degraded
         grey, a bright bloom flare, the middle of a dark ocean -- so it is a
         solid near-opaque panel rather than something tuned to sit on top of
         the globe. Same reasoning as #degraded's flat background. */
      .menu {
        position: fixed; z-index: 5; min-width: 13rem;
        background: #0d0b18; border: 1px solid #4b4166;
        border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        padding: 6px 0; font: 400 14px/1.4 system-ui, sans-serif;
        color: #f2f2f7;
        -webkit-user-select: none; user-select: none;
      }
      .menu-item {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 7px 14px; cursor: pointer;
      }
      .menu-item.disabled { color: #6b6880; cursor: default; }
      .menu-item:not(.disabled):hover { background: #251f3a; }
      /* The submenu header used to do nothing on click -- only its children
         did -- so it got no hover affordance either. That stopped being true
         when Layers went click-to-expand (12 layers made an always-expanded
         submenu ~17 rows tall on every open): the header IS the expand
         control now, so it needs the same hover cue as every other clickable
         row. Left as a distinct selector rather than folded into
         `.menu-item:not(.disabled):hover` because a group header row lives
         inside a submenu too and must stay non-interactive -- see
         `.menu-group-header` below. */
      .menu-submenu-wrap > .menu-item:hover { background: #251f3a; cursor: pointer; }
      .menu-submenu {
        padding-left: 14px;
        border-top: 1px solid #2a2540; border-bottom: 1px solid #2a2540;
      }
      .menu-check { width: 1.2em; text-align: center; color: #7cf0c2; }
      .menu-note { font-size: 11px; opacity: 0.7; max-width: 9em; text-align: right; }
      /* Layers group headers (SKY, WEATHER, MAP, EVENTS): a label, not a
         control. Small and dimmed so it reads as structure rather than as
         one more row to click, and explicitly non-interactive so it never
         picks up the hover cue the real rows around it have. */
      .menu-group-header {
        padding: 6px 14px 2px; font-size: 11px; letter-spacing: 0.06em;
        color: #6b6880; cursor: default; user-select: none;
      }
      .menu-group-header:first-child { padding-top: 2px; }
      /* The expand marker (▸ collapsed / ▾ expanded) rides in the same
         trailing slot a toggle's checkmark uses, so the header lines up with
         the rows it controls. */
      .menu-expand-mark { width: 1.2em; text-align: center; color: #9c96b8; }

      /* ---------------------------------------------------- custom arcs panel --
         Opened from the menu's "Custom arcs…" item. Mounted on document.body,
         never on #stage -- see js/custom_arcs_panel.js for why that is load-bearing
         (the same stacking-context trap the menu itself hit). */
      .custom-arc-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
                     z-index: 6; background: #12101fee; color: #d8d4ea;
                     border: 1px solid #2a2540; border-radius: 6px; padding: 14px 16px;
                     font: 13px/1.5 ui-monospace, monospace; min-width: 560px;
                     max-height: 70vh; overflow-y: auto; touch-action: auto; }
      .custom-arc-title { font-size: 15px; margin-bottom: 2px; }
      .custom-arc-hint { opacity: .55; margin-bottom: 10px; }
      .custom-arc-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px;
                   flex-wrap: wrap; }
      .custom-arc-row.bad .custom-arc-match { border-color: #e0a020; }
      /* min-width: 0 is what puts a row on ONE line. A flex item's automatic
         minimum is its min-content width, and an <input>'s min-content comes
         from its `size` attribute -- about 177px -- so the two text fields
         refused to shrink below ~354px between them and pushed the on/off and
         delete buttons onto a second line, under a wrap the reason line needs
         to exist. */
      .custom-arc-match { flex: 2 1 200px; min-width: 0; }
      .custom-arc-name { flex: 1 1 120px; min-width: 0; }
      .custom-arc-end { width: 88px; flex: 0 0 88px; }
      /* The header carries the same flex bases as the row below it, so the
         labels sit over the fields they name. Any change to one is a change to
         both. */
      /* ------------------------------------------------ the confirm dialog --
         Mounted on document.body like the menu and the custom arcs panel, and for
         the same reason: #stage is position:fixed and creates a stacking
         context, so anything inside it is painted under #rail. z-index above
         both, because this one is a question that must not be obscured by
         the thing it is asking about. */
      .confirm {
        position: fixed; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        background: #05040ab8;
      }
      /* max-height AND overflow, because the dialog's words are built from
         what is pending and can therefore be long: a Close after a Randomize
         names 23 settings and runs to ~1,000 characters. The parent centers
         with `align-items: center`, so an over-tall box grows off BOTH ends --
         the title clips at the top and the buttons go below the fold with
         nothing to scroll, leaving only Escape and the backdrop. Both of those
         are the SAFE answer, so the failure is one-sided and quiet: Yes simply
         becomes unreachable and the panel looks stuck. */
      .confirm-box {
        max-width: 560px; max-height: 96vh; overflow-y: auto;
        margin: 2vh; padding: 18px 20px;
        background: #12102a; border: 1px solid #7201a8;
        border-radius: 5px; color: #e8e4f5;
        font: 13px/1.55 ui-monospace, monospace;
        box-shadow: 0 18px 60px #000000a0;
      }
      .confirm-title { font-size: 16px; margin-bottom: 8px; color: #fdca26; }
      .confirm-lead { margin-bottom: 12px; opacity: .8; }
      .confirm-group { margin-bottom: 10px; }
      .confirm-group-head { font-size: 11px; letter-spacing: .1em; opacity: .6; }
      .confirm-list { margin: 4px 0 0; padding-left: 18px; }
      .confirm-list li { padding: 1px 0; }
      /* Amber for what changes, green for what is safe -- the same amber the
         alarm layer uses, so "this one is the consequence" needs no legend. */
      .confirm-will { color: #fb9f3a; }
      .confirm-wont { color: #4ade80; }
      .confirm-note { margin-top: 10px; opacity: .65; font-size: 12px; }
      .confirm-foot { display: flex; gap: 8px; justify-content: flex-end;
                      margin-top: 16px; }
      .confirm-foot button {
        background: #0b0916; color: inherit; border: 1px solid #2a2540;
        border-radius: 3px; padding: 5px 10px; font: inherit; cursor: pointer;
      }
      /* Cancel is the emphasised button, not confirm: it is focused, it is what
         Escape does, and it is the answer a stray click should land on. */
      .confirm-foot .confirm-no { border-color: #7201a8; }
      .confirm-foot .confirm-yes { opacity: .85; }
      /* Between the two it separates. Deliberately not styled as a second
         primary: the alt is the answer somebody reaches for on purpose, not the
         one a stray click lands on. */
      .confirm-alt {
        background: #7201a833; border: 1px solid #7201a8; color: #f0d9ff;
        padding: 6px 12px; border-radius: 3px; cursor: pointer;
      }
      .confirm-alt:hover { background: #7201a855; }
      .confirm-foot button:focus { outline: 1px solid #fdca26; outline-offset: 1px; }

      /* What MATCH accepts, spelled out. Dim and small: it is reference
         material somebody reads once, and it must not compete with the rows
         they came to edit. The example column is fixed-width so the four
         forms line up as a table without being one. */
      .custom-arc-legend { margin: 0 0 10px; font-size: 12px; opacity: .62; }
      .custom-arc-legend-row { display: flex; gap: 8px; align-items: baseline;
                          padding: 1px 0; }
      .custom-arc-legend-form { flex: 0 0 64px; text-transform: uppercase;
                           font-size: 10px; letter-spacing: .08em; opacity: .8; }
      .custom-arc-legend-eg { flex: 0 0 210px; color: #a855f7; font: inherit;
                         white-space: nowrap; }
      .custom-arc-legend-note { flex: 1 1 auto; min-width: 0; }
      .custom-arc-head { display: flex; gap: 6px; align-items: center;
                    margin-bottom: 4px; font-size: 11px; letter-spacing: .08em;
                    text-transform: uppercase; opacity: .5; }
      .custom-arc-head .h-match { flex: 2 1 200px; min-width: 0; }
      .custom-arc-head .h-end { flex: 0 0 88px; }
      .custom-arc-head .h-color { flex: 0 0 44px; }
      .custom-arc-head .h-name { flex: 1 1 120px; min-width: 0; }
      .custom-arc-head .h-flags { flex: 0 0 50px; }
      .custom-arc-panel input, .custom-arc-panel select, .custom-arc-panel button {
        background: #0b0916; color: inherit; border: 1px solid #2a2540;
        border-radius: 3px; padding: 3px 6px; font: inherit; }
      .custom-arc-color { width: 44px; padding: 1px; }
      /* The two built-in classes sit IN the rule list, first and last, so the
         columns have to be the rule row's own. Only the swatch is editable;
         the text cells are what the engine does, not fields. */
      .custom-arc-fixed { display: flex; gap: 6px; align-items: center;
                     margin-bottom: 4px; flex-wrap: wrap; }
      .custom-arc-fixed-match { flex: 2 1 200px; min-width: 0; opacity: .5;
                           font-style: italic; }
      /* nowrap: the column is 88px and "fallback" is the widest word that
         goes in it. Wrapped, these two rows stood a line taller than every
         rule between them and the list stopped reading as one table. */
      .custom-arc-fixed-end { flex: 0 0 88px; opacity: .5; font-style: italic;
                         white-space: nowrap; }
      .custom-arc-fixed-name { flex: 1 1 120px; min-width: 0; opacity: .75; }
      .custom-arc-fixed-auto { flex: 0 0 50px; }
      .custom-arc-reason { flex: 1 0 100%; color: #e0a020; opacity: .9; padding-left: 2px; }
      .custom-arc-add { margin-top: 8px; }
      .custom-arc-foot { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

      /* The tuning panel: a LEFT RAIL, mirroring the right one. It is still
         `position: fixed` on the left edge, but `body.tuner` narrows #stage by
         exactly its width, so the globe sits BESIDE it and is never underneath
         it. It was an overlay until the display it runs on said otherwise; see
         js/settings_panel.js for what narrowing costs and why it wins anyway.
         No `max-width`: a panel wider than the slice #stage gives up is a panel
         back over the globe. What replaced it is the `min()` inside
         --tuner-width itself, so the panel and the slice are still ONE number
         and are bounded together -- a max-width here would bound only the
         panel and leave the stage giving up a slice nothing sits in.
         Mounted on body, so its z-index competes with #rail directly rather
         than being trapped in #stage's stacking context. */
      .tuner-panel {
        position: fixed; top: 0; left: 0; bottom: 0; width: var(--tuner-width);
        /* border-box, or the padding and the border are ADDED to the width and
           the panel occupies 413px of a 380px slice -- 33px of it back over the
           globe, which is the whole thing this rail exists to stop. Caught by
           verify_tuner.py case 2, which asserts the stage narrows by exactly
           the panel's own rendered width rather than by the number in the CSS. */
        box-sizing: border-box;
        z-index: 6; overflow-y: auto;
        background: #12101fee; color: #d8d4ea;
        border-right: 1px solid #ffffff1a;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* No padding at the TOP: `.tuner-sticky` carries its own, so the
           pinned header covers the full width of the scrollport and no row
           can be seen sliding through a gap above it. */
        padding: 0 1rem 1.2rem;
      }
      /* The pinned header block: title, the four buttons, the pending count
         and the feedback line. At 39 rows the panel is ~1975px of content on a
         1440px screen (~3636px at the clamped 189px width), so without this
         the buttons are off screen the moment anyone scrolls to the arc-shape
         group -- the same "a control past the fold does not exist" failure
         that moved them out of a footer, reached from the other end.
         The background is OPAQUE where the panel's is #12101fee: rows pass
         behind this block, and a translucent pin would show them through the
         buttons. Over the near-black page ground the two read the same. */
      .tuner-sticky {
        position: sticky; top: 0; z-index: 1;
        background: #12101f; padding: 0.9rem 0 0.3rem;
      }
      /* Revert, Keep and Close all live here now, beside the title and above
         the rows -- they were in a footer past the fold, where the display
         reported never having seen them. `flex-wrap` with the three buttons in
         their own `.tuner-actions` box is what makes a narrow panel degrade
         honestly: at 380px the title and all three fit on one line (measured
         ~222px of ~347px usable), and if a smaller panel or a larger font ever
         breaks that, the whole button group drops to a second line TOGETHER
         rather than one button wrapping away from its neighbors. */
      .tuner-head { display: flex; align-items: center; justify-content: space-between;
                    flex-wrap: wrap; gap: 0.4rem; }
      .tuner-title { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
                     margin: 0; color: #dda825; flex: 1 1 auto; }
      /* The actions group. It is NOT a guard against an overflow, whatever an
         earlier version of this comment claimed: re-run with the rule deleted,
         verify_tuner.py case 11 is green and nothing hangs off the panel.
         Without it the four buttons are inline-blocks in a plain block div, so
         they wrap as inline content on their own and the div's min-content
         width is the widest single button either way -- there is nothing here
         to overflow.

         What it actually buys, measured at 420px (panel 189px) with and
         without: the 0.35rem gaps (without it the buttons touch -- Randomize
         ends at x=94 and Revert starts at 94) and right alignment of the
         wrapped second row (Keep at x=75 with, x=16 without). At 2560px both
         fit one row and only the gaps differ. Kept for those two, as a design
         decision and not a guard -- a rule documented as load-bearing is one
         nobody dares touch for the wrong reason.

         The full history, including how this rule spent its whole life being
         dropped by the CSS parser, is in CLAUDE.md. It is written up THERE and
         not here on purpose: telling that story needs the comment terminator
         as a literal, and writing one inside a comment ends the comment. That
         is not hypothetical -- the commit that fixed it reintroduced it in the
         paragraph describing the fix, and tests/test_static_css.py exists
         because of that. */
      .tuner-actions { display: flex; align-items: center; gap: 0.35rem;
                       flex: 0 1 auto; min-width: 0; flex-wrap: wrap;
                       justify-content: flex-end; }
      .tuner-lead { color: #9c96b8; margin: 0.5rem 0 0.9rem; }
      .tuner-scope { margin-top: -0.5rem; }
      /* The "Randomize can roll this row" mark. THREE constraints decided it:
         it must not compete with the labels or the values, it must not use the
         alarm amber (#dda825 means "blocked" everywhere else on this display,
         and the dirty marker beside it already spends that hue), and it must
         not push a row onto a second line.
         Hence a violet-grey a step BELOW the muted text (#9c96b8) rather than a
         hue of its own -- the same "a lift, not a new color" rule the hover
         states follow, run downward. And hence a fixed-width inline gutter
         emitted on EVERY row, empty on the ones Randomize leaves: the reserved
         1.1em is what keeps the labels aligned in one column, so a MARKED row
         costs exactly what a held one does (verify_tuner.py case 12 blanks
         every mark and asserts no row's height or label position moves).
         That measurement does not say the gutter itself is free -- it is not,
         it takes ~13px off every label at the clamped 189px panel. What makes
         it safe is structural: `.tuner-row` sets no `flex-wrap`, so a label
         short of room wraps inside itself and the row grows taller rather than
         the controls dropping to a second line. */
      .tuner-mark { display: inline-block; width: 1.1em; color: #6f6893; }
      /* The "changing this clears the arcs on screen" mark. It qualifies the
         label it follows, so it is a SUFFIX inside the label rather than a
         second gutter: it appears on 9 rows of 39, and a reserved column for
         it would take width off all 39 to warn about a quarter of them.
         A step ABOVE the randomize gutter (#9c96b8, the muted text color)
         rather than below it -- this one is a warning and that one is a
         capability -- and still not the alarm amber, which means "blocked"
         everywhere else on this display. `margin-left` and not a space in the
         text node, so the gap survives any future white-space collapsing. */
      .tuner-rebuild { margin-left: 0.35em; color: #9c96b8; }
      .tuner-group { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
                     color: #9c96b8; margin: 1rem 0 0.4rem;
                     border-bottom: 1px solid #ffffff14; padding-bottom: 0.2rem; }
      .tuner-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.18rem 0; }
      /* min-width: 0 on the flex children, or an <input>'s min-content width
         (from its `size` attribute, ~177px) refuses to shrink and pushes the
         row onto two lines. Same trap the custom arcs panel hit. */
      .tuner-label { flex: 1 1 40%; min-width: 0; }
      .tuner-range { flex: 1 1 35%; min-width: 0; }
      .tuner-number { flex: 0 0 5.2rem; min-width: 0; }
      .tuner-color { flex: 0 0 2.2rem; height: 1.3rem; padding: 0; border: 0;
                     background: none; }
      .tuner-hex { flex: 0 0 5.2rem; color: #9c96b8; }
      .tuner-dirty .tuner-label { color: #dda825; }
      .tuner-dirty .tuner-label::after { content: ' *'; }
      /* Both of these moved up with the buttons: the count is what Revert and
         Keep act on, and the note reports what they just did. */
      .tuner-count { color: #9c96b8; margin-top: 0.45rem; }
      .tuner-note { color: #dda825; min-height: 1.2em; }
      .tuner-panel input, .tuner-panel button {
        font: inherit; color: inherit; background: #ffffff10;
        border: 1px solid #ffffff22; border-radius: 3px; padding: 0.1rem 0.35rem;
      }
      .tuner-panel button { cursor: pointer; }
      .tuner-panel button:disabled { opacity: 0.4; cursor: default; }

      /* ------------------------------------------------------ hover states --
         Every clickable control on the page lights slightly under the pointer,
         and every one of them says so with `cursor: pointer` as well -- the two
         halves of one signal, asked for from the wall ("there should be a color
         change when im hovering over a clickable button").

         A LIFT, NOT A NEW COLOR. The ground is near-black and the scheme is
         plasma, so each rule raises the control's OWN background and border a
         step -- `#ffffff10` toward `#ffffff20` in the tuning panel, `#0b0916`
         toward a slightly lighter violet-grey in the dialogs. No hue appears on
         hover that is not already on the display, and the alarm amber is not
         used at all: it means "blocked" everywhere else, and spending it on a
         mouse pointer would devalue it where it matters.

         A DISABLED CONTROL MUST NOT MOVE. That is the whole signal: Keep and
         Revert are disabled with nothing pending, and a disabled button that
         lights up under the pointer is a control lying about being clickable.
         Hence `:hover:not(:disabled)` -- and note the menu, whose rows are
         disabled by a CLASS rather than the attribute, needs `:not(.disabled)`
         instead; its rule is up beside `.menu-item` and is left as the one
         place that knows that. `verify_tuner.py` case 10 hovers the disabled
         Keep and asserts its computed background is unchanged, then makes a
         change and asserts the enabled one does move. */
      .tuner-panel button:hover:not(:disabled) {
        background: #ffffff20; border-color: #ffffff3d;
      }
      /* The color swatch and the checkboxes are clicked too, so they carry the
         pointer even though they are inputs rather than buttons. The range
         sliders deliberately do not: a drag is not a click, and the browser's
         own affordance for one is the right one. */
      .tuner-panel input[type="color"],
      .tuner-panel input[type="checkbox"] { cursor: pointer; }
      .tuner-panel input[type="color"]:hover:not(:disabled) { border-color: #ffffff3d; }

      /* The theme panel. It carries BOTH `tuner-panel` and `theme-panel` on
         its root node -- the first is where the shared chrome lives (the
         sticky header, the buttons, the row/label/color/hex layout, every
         hover state), so this block only has to add what is actually new:
         the width (a second custom property, not --tuner-width -- see the
         comment on it in :root), the preset <select>, which the generic
         `.tuner-panel input, .tuner-panel button` rule does not reach
         because a <select> is neither, and the gradient bar. */
      .theme-panel { width: var(--theme-panel-width); }
      .theme-summary { color: #9c96b8; margin: 0.3rem 0 0; font-style: italic; }
      .theme-preset {
        font: inherit; color: inherit; background: #ffffff10;
        border: 1px solid #ffffff22; border-radius: 3px; padding: 0.1rem 0.35rem;
        cursor: pointer;
      }
      .theme-preset:hover { background: #ffffff20; border-color: #ffffff3d; }
      /* The stop handles sit ABOVE the bar rather than inside a shared flex
         row, because a <input type=color> has a fixed intrinsic size that a
         flex track cannot spread evenly to ten even stops -- percentage
         `left` on an absolutely positioned handle can. `transform:
         translateX(-50%)` centers each handle on its own stop rather than
         on its left edge, so stop 0 and stop 9 sit exactly on the bar's own
         ends rather than hanging half off it. */
      .theme-gradient-wrap { position: relative; margin: 0.7rem 0 1.1rem; height: 30px; }
      .theme-gradient {
        position: absolute; inset: 0; border-radius: 3px;
        border: 1px solid #ffffff1a;
      }
      .theme-stops { position: absolute; inset: 0; }
      .theme-stop {
        position: absolute; top: -3px; width: 1.4rem; height: 1.4rem;
        padding: 0; border: 1px solid #ffffff3d; border-radius: 3px;
        background: none; cursor: pointer; transform: translateX(-50%);
      }
      .theme-stop:hover { border-color: #ffffff6b; }
      /* The per-element return-to-auto button. Same lift-not-a-new-color
         hover rule as every other control here -- it is a <button>, so the
         generic `.tuner-panel button` rule already covers it; this only
         narrows it to a glyph's width so it does not compete with the
         swatch and the hex readout for the row's tight 347px. */
      .theme-revert-el { flex: 0 0 auto; padding: 0.1rem 0.4rem; }

      .custom-arc-panel button, .custom-arc-panel select,
      .custom-arc-panel input[type="color"] { cursor: pointer; }
      .custom-arc-panel button:hover:not(:disabled),
      .custom-arc-panel select:hover:not(:disabled) {
        background: #17142b; border-color: #3d3560;
      }
      /* The per-row controls: the enable toggle, the delete cross, "+ Add
         rule". They are buttons, so the rule above already covers them --
         these two only carry what is specific to each. The delete cross warms
         toward the refusal color the panel already uses for a bad row rather
         than to the alarm amber. */
      .custom-arc-panel .custom-arc-delete:hover:not(:disabled) { border-color: #7201a8; }
      .custom-arc-panel input[type="color"]:hover:not(:disabled) { border-color: #3d3560; }

      .confirm-foot button:hover:not(:disabled) {
        background: #17142b; border-color: #3d3560;
      }
      /* Cancel keeps its violet edge on hover -- it is the emphasized answer,
         and a hover that flattened the two buttons together would undo the one
         piece of shape this dialog has. */
      .confirm-foot .confirm-no:hover:not(:disabled) { border-color: #9333ea; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/"
        }
      }
    </script>
  </head>
  <body>
    <div id="degraded" role="status"></div>
    <div id="stage"><canvas id="scene"></canvas></div>
    <!-- Populated only when the menu's Stats rail toggle is on; otherwise it
         stays empty and display:none, and js/rail.js never polls. -->
    <aside id="rail"></aside>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
