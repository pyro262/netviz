<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Kills the white flash on the self-reload. The browser paints the base
         canvas before any CSS is parsed, and its default is white -- on a dark
         wall display that is a full-screen strobe every time /build.json
         changes. `background: #0b0916` below is too late to prevent it; this
         meta is read first and makes the pre-CSS canvas dark. -->
    <meta name="color-scheme" content="dark">
    <title>netviz</title>
    <!-- PNGs only, deliberately. Chrome prefers an SVG icon at every size, and
         the detailed mark (meridian grid, three arcs) is mush in a 16px tab.
         icon.svg / icon-512.png stay in the tree for anything that wants the
         full drawing. Regenerate all four with tools/make_icon.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0916; }
      /* The canvas sizes itself to #stage, not to the window, so the optional
         right rail can take a slice of the viewport without the globe rendering
         off-centre. With the rail off, #stage IS the viewport. */
      #stage { position: fixed; inset: 0; }
      body.rail #stage { right: 26%; }
      /* width/height belt-and-braces against renderer.setSize's updateStyle:
         without a CSS size the canvas lays out at its intrinsic pixel size,
         which is viewport * devicePixelRatio -- correct only at dpr 1. */
      canvas { display: block; width: 100%; height: 100%; transition: filter 1.6s ease; }
      /* Required, and required in CSS rather than JS: without it the browser
         scrolls the page out from under a drag on a tablet before any handler
         runs. */
      canvas { touch-action: none; }
      /* An arrow parked on a dark wall for a week is the most visible thing in
         the room. */
      canvas.cursor-hidden { cursor: none; }
      /* Degraded: drain the color out of the whole scene in one move --
         arcs, city lights and bloom included -- so a dead feed cannot be
         mistaken for a quiet night. */
      body.degraded canvas { filter: grayscale(0.88) brightness(0.62); }
      #degraded {
        position: fixed; top: 0; left: 0; right: 0; z-index: 2;
        display: none;
        padding: 0.6rem 1.2rem;
        background: #fb9f3a;            /* plasma #fb9f3a */
        color: #17122b;
        font: 600 clamp(18px, 2.1vw, 40px)/1.2 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-align: center;
      }
      #degraded.on { display: block; }

      /* ---------------------------------------------------- the right rail --
         Off unless turned on from the on-screen menu -- see js/rail.js.
         Nothing below applies to a default kiosk, and #rail stays empty and
         undisplayed. Sizes are in vw so the rail reads the same on a 1080p
         desk monitor and a 4K wall. */
      #rail {
        position: fixed; top: 0; right: 0; bottom: 0; width: 26%;
        display: none; flex-direction: column; gap: 1.4vh;
        box-sizing: border-box; padding: 1.6vh 1.4vw;
        background: #12102400;         /* transparent-backed, per the design */
        color: #fdca26;                /* plasma */
        font: 400 1.05vw/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        /* Degraded mode fades the stats out over 2s (the canvas drain next to
           it takes 1.6s) rather than blanking them: the last known numbers are
           what someone walking up to a dead feed wants to see. */
        transition: opacity 2s ease;
      }
      #rail.on { display: flex; }
      body.degraded #rail { opacity: 0.28; }

      .rail-head { display: flex; align-items: baseline; justify-content: space-between; }
      .rail-title { font-size: 1.5vw; font-weight: 600; color: #f0f921; letter-spacing: 0.18em; }
      .rail-clock { text-align: right; color: #d8576b; }
      .rail-clock-local { font-size: 1.35vw; color: #fdca26; }
      .rail-clock-utc { font-size: 0.85vw; opacity: 0.7; }

      /* The collector's build, bottom right. margin-top:auto pushes it to the
         foot of the flex column whatever the panels above it are doing, and it
         is deliberately the dimmest thing on the rail: useful when you go
         looking for it, invisible when you are not. */
      .rail-foot {
        margin-top: auto; text-align: right;
        font-size: 0.8vw; opacity: 0.45; letter-spacing: 0.1em;
      }

      .rail-panel { border-top: 1px solid #7201a855; padding-top: 0.9vh; }
      .rail-panel-title {
        margin: 0 0 0.5vh; font-size: 0.9vw; font-weight: 600;
        letter-spacing: 0.22em; color: #ed7953;
      }
      .rail-panel-note { margin-left: 0.6em; opacity: 0.6; }

      .rail-big { display: flex; align-items: baseline; gap: 0.6vw; margin-bottom: 0.6vh; }
      .rail-big-value { font-size: 3.1vw; line-height: 1; color: #fdca26; }
      .rail-big-note { font-size: 0.8vw; letter-spacing: 0.18em; color: #d8576b; }

      /* Two shapes. A plain row is label + right-aligned value. A row with a
         bar puts the bar last and lets it take the slack, so the country codes
         and their counts stay in fixed columns while only the bar changes
         width. Both keep the label column the same, so the two panels read as
         one list. */
      .rail-row {
        display: grid; grid-template-columns: 1fr auto; gap: 0.6vw;
        align-items: center; padding: 0.18vh 0;
      }
      /* The block rows carry a fourth column: the last hour as a sparkline.
         Fixed width rather than a second 1fr, so the 24h bar keeps the space
         it had and the two do not trade width as counts change. */
      .rail-row.bars { grid-template-columns: 3.2em auto 1fr 4.5em; }
      .rail-row.muted { opacity: 0.45; }
      .rail-label { color: #bd3786; }
      .rail-value { color: #fdca26; text-align: right; font-variant-numeric: tabular-nums; }
      .rail-value.bad { color: #fb9f3a; font-weight: 600; }
      .rail-bar { display: block; height: 0.55vh; background: #46039f55; }
      .rail-bar-fill { display: block; height: 100%; background: #ed7953; }
      /* Dimmer than the bar it sits beside: the day's ranking is the headline
         and the hour's shape is the qualifier. vector-effect keeps the stroke
         1px after the viewBox is stretched to the column -- without it the
         non-uniform scale turns the line into a wedge. */
      /* Update watermark, lower left. Deliberately not the alarm amber: an
         available update is not an alarm, and spending that color on one
         devalues it where it matters. Violet is the map's own hue, so this
         reads as part of the furniture rather than as an event.

         pointer-events:none because the wall has no interaction at all and a
         stray element that could swallow one would be a bug nobody looks for.
         It transitions opacity only -- transitioning `display` or `visibility`
         does nothing, and the fade is the whole point. */
      .update-mark {
        position: fixed; left: 1.6vw; bottom: 1.4vh; z-index: 3;
        font-size: 0.85vw; letter-spacing: 0.18em;
        color: #b39ddb; opacity: 0;
        transition-property: opacity; transition-timing-function: ease;
        pointer-events: none; user-select: none;
      }
      /* Two animations, not one: a single looping animation cannot also do a
         one-time fade-in. `update-in` runs once and holds its end state with
         `forwards`, then `update-breathe` starts after the same 2s and wins
         the property from then on, because the later of two active animations
         on one property is the one that applies.

         7s and ease-in-out: slow enough that it never reads as a blink or a
         flicker, and far off the cadence of anything else on the display, so
         it does not sync with arc or ripple motion. It is the only thing here
         that breathes, which is what makes peripheral vision find it. */
      @keyframes update-in { from { opacity: 0; } to { opacity: 0.32; } }
      @keyframes update-breathe {
        0%   { opacity: 0.20; }
        50%  { opacity: 0.52; }
        100% { opacity: 0.20; }
      }
      .update-mark.on {
        opacity: 0.32;
        animation: update-in 2s ease forwards,
                   update-breathe 7s ease-in-out 2s infinite;
      }
      /* Someone who has asked the system for less motion gets the mark, still
         legible, without the pulse -- the information is the point and the
         movement is only how it is found. */
      @media (prefers-reduced-motion: reduce) {
        .update-mark.on { animation: update-in 2s ease forwards; opacity: 0.32; }
      }
      /* Degraded mode already drains the canvas to grey; the watermark is not
         part of that story and steps further back rather than competing with
         the banner that is. */
      body.degraded .update-mark.on { opacity: 0.16; }
      #rail .rail-swatch { display:inline-block; width:8px; height:8px; border-radius:2px;
                           margin-right:6px; vertical-align:middle; }
      /* A muted row dims its TEXT, never its swatch. The swatch is a sample of
         a color that is on the globe right now, and a sample shown at 45%
         opacity is a different color -- the one thing a key must not be. */
      .rail-row.muted .rail-swatch { opacity: 1; }
      .rail-spark { display: block; width: 100%; height: 1.4vh; overflow: visible; }
      .rail-spark polyline {
        fill: none; stroke: #ed795399; stroke-width: 1;
        stroke-linejoin: round; stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      /* ------------------------------------------------------------ the menu --
         Opened by right-click, `s`, or a double tap (js/menu.js + a later
         task's wiring); closed by an outside click, the opening gesture
         repeated, a successful action, esc, or the page losing focus.

         Deliberately its OWN palette, not the wall's plasma scheme: it has to
         stay readable whatever the display is doing underneath it -- degraded
         grey, a bright bloom flare, the middle of a dark ocean -- so it is a
         solid near-opaque panel rather than something tuned to sit on top of
         the globe. Same reasoning as #degraded's flat background. */
      .menu {
        position: fixed; z-index: 5; min-width: 13rem;
        background: #0d0b18; border: 1px solid #4b4166;
        border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        padding: 6px 0; font: 400 14px/1.4 system-ui, sans-serif;
        color: #f2f2f7;
        -webkit-user-select: none; user-select: none;
      }
      .menu-item {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 7px 14px; cursor: pointer;
      }
      .menu-item.disabled { color: #6b6880; cursor: default; }
      .menu-item:not(.disabled):hover { background: #251f3a; }
      /* The submenu's own header row does nothing on click -- only its
         children do -- so it gets no hover affordance either. */
      .menu-submenu-wrap > .menu-item:hover { background: none; cursor: default; }
      .menu-submenu {
        padding-left: 14px;
        border-top: 1px solid #2a2540; border-bottom: 1px solid #2a2540;
      }
      .menu-check { width: 1.2em; text-align: center; color: #7cf0c2; }
      .menu-note { font-size: 11px; opacity: 0.7; max-width: 9em; text-align: right; }

      /* --------------------------------------------------------- rules panel --
         Opened from the menu's "Color rules…" item. Mounted on document.body,
         never on #stage -- see js/rules_panel.js for why that is load-bearing
         (the same stacking-context trap the menu itself hit). */
      .rules-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
                     z-index: 6; background: #12101fee; color: #d8d4ea;
                     border: 1px solid #2a2540; border-radius: 6px; padding: 14px 16px;
                     font: 13px/1.5 ui-monospace, monospace; min-width: 560px;
                     max-height: 70vh; overflow-y: auto; touch-action: auto; }
      .rules-title { font-size: 15px; margin-bottom: 2px; }
      .rules-hint { opacity: .55; margin-bottom: 10px; }
      .rules-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px;
                   flex-wrap: wrap; }
      .rules-row.bad .rules-match { border-color: #e0a020; }
      /* min-width: 0 is what puts a row on ONE line. A flex item's automatic
         minimum is its min-content width, and an <input>'s min-content comes
         from its `size` attribute -- about 177px -- so the two text fields
         refused to shrink below ~354px between them and pushed the on/off and
         delete buttons onto a second line, under a wrap the reason line needs
         to exist. */
      .rules-match { flex: 2 1 200px; min-width: 0; }
      .rules-name { flex: 1 1 120px; min-width: 0; }
      .rules-end { width: 88px; flex: 0 0 88px; }
      /* The header carries the same flex bases as the row below it, so the
         labels sit over the fields they name. Any change to one is a change to
         both. */
      /* ------------------------------------------------ the confirm dialog --
         Mounted on document.body like the menu and the rules panel, and for
         the same reason: #stage is position:fixed and creates a stacking
         context, so anything inside it is painted under #rail. z-index above
         both, because this one is a question that must not be obscured by
         the thing it is asking about. */
      .confirm {
        position: fixed; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        background: #05040ab8;
      }
      .confirm-box {
        max-width: 560px; margin: 2vh; padding: 18px 20px;
        background: #12102a; border: 1px solid #7201a8;
        border-radius: 5px; color: #e8e4f5;
        font: 13px/1.55 ui-monospace, monospace;
        box-shadow: 0 18px 60px #000000a0;
      }
      .confirm-title { font-size: 16px; margin-bottom: 8px; color: #fdca26; }
      .confirm-lead { margin-bottom: 12px; opacity: .8; }
      .confirm-group { margin-bottom: 10px; }
      .confirm-group-head { font-size: 11px; letter-spacing: .1em; opacity: .6; }
      .confirm-list { margin: 4px 0 0; padding-left: 18px; }
      .confirm-list li { padding: 1px 0; }
      /* Amber for what changes, green for what is safe -- the same amber the
         alarm layer uses, so "this one is the consequence" needs no legend. */
      .confirm-will { color: #fb9f3a; }
      .confirm-wont { color: #4ade80; }
      .confirm-note { margin-top: 10px; opacity: .65; font-size: 12px; }
      .confirm-foot { display: flex; gap: 8px; justify-content: flex-end;
                      margin-top: 16px; }
      .confirm-foot button {
        background: #0b0916; color: inherit; border: 1px solid #2a2540;
        border-radius: 3px; padding: 5px 10px; font: inherit; cursor: pointer;
      }
      /* Cancel is the emphasised button, not confirm: it is focused, it is what
         Escape does, and it is the answer a stray click should land on. */
      .confirm-foot .confirm-no { border-color: #7201a8; }
      .confirm-foot .confirm-yes { opacity: .85; }
      .confirm-foot button:focus { outline: 1px solid #fdca26; outline-offset: 1px; }

      /* What MATCH accepts, spelled out. Dim and small: it is reference
         material somebody reads once, and it must not compete with the rows
         they came to edit. The example column is fixed-width so the four
         forms line up as a table without being one. */
      .rules-legend { margin: 0 0 10px; font-size: 12px; opacity: .62; }
      .rules-legend-row { display: flex; gap: 8px; align-items: baseline;
                          padding: 1px 0; }
      .rules-legend-form { flex: 0 0 64px; text-transform: uppercase;
                           font-size: 10px; letter-spacing: .08em; opacity: .8; }
      .rules-legend-eg { flex: 0 0 210px; color: #a855f7; font: inherit;
                         white-space: nowrap; }
      .rules-legend-note { flex: 1 1 auto; min-width: 0; }
      .rules-head { display: flex; gap: 6px; align-items: center;
                    margin-bottom: 4px; font-size: 11px; letter-spacing: .08em;
                    text-transform: uppercase; opacity: .5; }
      .rules-head .h-match { flex: 2 1 200px; min-width: 0; }
      .rules-head .h-end { flex: 0 0 88px; }
      .rules-head .h-color { flex: 0 0 44px; }
      .rules-head .h-name { flex: 1 1 120px; min-width: 0; }
      .rules-head .h-flags { flex: 0 0 50px; }
      .rules-panel input, .rules-panel select, .rules-panel button {
        background: #0b0916; color: inherit; border: 1px solid #2a2540;
        border-radius: 3px; padding: 3px 6px; font: inherit; }
      .rules-color { width: 44px; padding: 1px; }
      .rules-reason { flex: 1 0 100%; color: #e0a020; opacity: .9; padding-left: 2px; }
      .rules-add { margin-top: 8px; }
      .rules-foot { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/"
        }
      }
    </script>
  </head>
  <body>
    <div id="degraded" role="status"></div>
    <div id="stage"><canvas id="scene"></canvas></div>
    <!-- Populated only when the menu's Stats rail toggle is on; otherwise it
         stays empty and display:none, and js/rail.js never polls. -->
    <aside id="rail"></aside>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
