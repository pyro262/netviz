<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Kills the white flash on the self-reload. The browser paints the base
         canvas before any CSS is parsed, and its default is white -- on a dark
         wall display that is a full-screen strobe every time /build.json
         changes. `background: #0b0916` below is too late to prevent it; this
         meta is read first and makes the pre-CSS canvas dark. -->
    <meta name="color-scheme" content="dark">
    <title>netviz</title>
    <!-- PNGs only, deliberately. Chrome prefers an SVG icon at every size, and
         the detailed mark (meridian grid, three arcs) is mush in a 16px tab.
         icon.svg / icon-512.png stay in the tree for anything that wants the
         full drawing. Regenerate all four with tools/make_icon.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0916; }
      /* The canvas sizes itself to #stage, not to the window, so the optional
         right rail can take a slice of the viewport without the globe rendering
         off-centre. With the rail off, #stage IS the viewport. */
      #stage { position: fixed; inset: 0; }
      body.rail #stage { right: 26%; }
      /* width/height belt-and-braces against renderer.setSize's updateStyle:
         without a CSS size the canvas lays out at its intrinsic pixel size,
         which is viewport * devicePixelRatio -- correct only at dpr 1. */
      canvas { display: block; width: 100%; height: 100%; transition: filter 1.6s ease; }
      /* Required, and required in CSS rather than JS: without it the browser
         scrolls the page out from under a drag on a tablet before any handler
         runs. */
      canvas { touch-action: none; }
      /* An arrow parked on a dark wall for a week is the most visible thing in
         the room. */
      canvas.cursor-hidden { cursor: none; }
      /* Degraded: drain the colour out of the whole scene in one move --
         arcs, city lights and bloom included -- so a dead feed cannot be
         mistaken for a quiet night. */
      body.degraded canvas { filter: grayscale(0.88) brightness(0.62); }
      #degraded {
        position: fixed; top: 0; left: 0; right: 0; z-index: 2;
        display: none;
        padding: 0.6rem 1.2rem;
        background: #fb9f3a;            /* plasma #fb9f3a */
        color: #17122b;
        font: 600 clamp(18px, 2.1vw, 40px)/1.2 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-align: center;
      }
      #degraded.on { display: block; }

      /* ---------------------------------------------------- the right rail --
         Off unless ?rail=1 -- see js/rail.js. Nothing below applies to a
         default kiosk, and #rail stays empty and undisplayed. Sizes are in vw
         so the rail reads the same on a 1080p desk monitor and a 4K wall. */
      #rail {
        position: fixed; top: 0; right: 0; bottom: 0; width: 26%;
        display: none; flex-direction: column; gap: 1.4vh;
        box-sizing: border-box; padding: 1.6vh 1.4vw;
        background: #12102400;         /* transparent-backed, per the design */
        color: #fdca26;                /* plasma */
        font: 400 1.05vw/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        /* Degraded mode fades the stats out over 2s (the canvas drain next to
           it takes 1.6s) rather than blanking them: the last known numbers are
           what someone walking up to a dead feed wants to see. */
        transition: opacity 2s ease;
      }
      #rail.on { display: flex; }
      body.degraded #rail { opacity: 0.28; }

      .rail-head { display: flex; align-items: baseline; justify-content: space-between; }
      .rail-title { font-size: 1.5vw; font-weight: 600; color: #f0f921; letter-spacing: 0.18em; }
      .rail-clock { text-align: right; color: #d8576b; }
      .rail-clock-local { font-size: 1.35vw; color: #fdca26; }
      .rail-clock-utc { font-size: 0.85vw; opacity: 0.7; }

      /* The collector's build, bottom right. margin-top:auto pushes it to the
         foot of the flex column whatever the panels above it are doing, and it
         is deliberately the dimmest thing on the rail: useful when you go
         looking for it, invisible when you are not. */
      .rail-foot {
        margin-top: auto; text-align: right;
        font-size: 0.8vw; opacity: 0.45; letter-spacing: 0.1em;
      }

      .rail-panel { border-top: 1px solid #7201a855; padding-top: 0.9vh; }
      .rail-panel-title {
        margin: 0 0 0.5vh; font-size: 0.9vw; font-weight: 600;
        letter-spacing: 0.22em; color: #ed7953;
      }
      .rail-panel-note { margin-left: 0.6em; opacity: 0.6; }

      .rail-big { display: flex; align-items: baseline; gap: 0.6vw; margin-bottom: 0.6vh; }
      .rail-big-value { font-size: 3.1vw; line-height: 1; color: #fdca26; }
      .rail-big-note { font-size: 0.8vw; letter-spacing: 0.18em; color: #d8576b; }

      /* Two shapes. A plain row is label + right-aligned value. A row with a
         bar puts the bar last and lets it take the slack, so the country codes
         and their counts stay in fixed columns while only the bar changes
         width. Both keep the label column the same, so the two panels read as
         one list. */
      .rail-row {
        display: grid; grid-template-columns: 1fr auto; gap: 0.6vw;
        align-items: center; padding: 0.18vh 0;
      }
      /* The block rows carry a fourth column: the last hour as a sparkline.
         Fixed width rather than a second 1fr, so the 24h bar keeps the space
         it had and the two do not trade width as counts change. */
      .rail-row.bars { grid-template-columns: 3.2em auto 1fr 4.5em; }
      .rail-row.muted { opacity: 0.45; }
      .rail-label { color: #bd3786; }
      .rail-value { color: #fdca26; text-align: right; font-variant-numeric: tabular-nums; }
      .rail-value.bad { color: #fb9f3a; font-weight: 600; }
      .rail-bar { display: block; height: 0.55vh; background: #46039f55; }
      .rail-bar-fill { display: block; height: 100%; background: #ed7953; }
      /* Dimmer than the bar it sits beside: the day's ranking is the headline
         and the hour's shape is the qualifier. vector-effect keeps the stroke
         1px after the viewBox is stretched to the column -- without it the
         non-uniform scale turns the line into a wedge. */
      /* Update watermark, lower left. Deliberately not the alarm amber: an
         available update is not an alarm, and spending that colour on one
         devalues it where it matters. Violet is the map's own hue, so this
         reads as part of the furniture rather than as an event.

         pointer-events:none because the wall has no interaction at all and a
         stray element that could swallow one would be a bug nobody looks for.
         It transitions opacity only -- transitioning `display` or `visibility`
         does nothing, and the fade is the whole point. */
      .update-mark {
        position: fixed; left: 1.6vw; bottom: 1.4vh; z-index: 3;
        font-size: 0.85vw; letter-spacing: 0.18em;
        color: #b39ddb; opacity: 0;
        transition-property: opacity; transition-timing-function: ease;
        pointer-events: none; user-select: none;
      }
      /* Two animations, not one: a single looping animation cannot also do a
         one-time fade-in. `update-in` runs once and holds its end state with
         `forwards`, then `update-breathe` starts after the same 2s and wins
         the property from then on, because the later of two active animations
         on one property is the one that applies.

         7s and ease-in-out: slow enough that it never reads as a blink or a
         flicker, and far off the cadence of anything else on the display, so
         it does not sync with arc or ripple motion. It is the only thing here
         that breathes, which is what makes peripheral vision find it. */
      @keyframes update-in { from { opacity: 0; } to { opacity: 0.32; } }
      @keyframes update-breathe {
        0%   { opacity: 0.20; }
        50%  { opacity: 0.52; }
        100% { opacity: 0.20; }
      }
      .update-mark.on {
        opacity: 0.32;
        animation: update-in 2s ease forwards,
                   update-breathe 7s ease-in-out 2s infinite;
      }
      /* Someone who has asked the system for less motion gets the mark, still
         legible, without the pulse -- the information is the point and the
         movement is only how it is found. */
      @media (prefers-reduced-motion: reduce) {
        .update-mark.on { animation: update-in 2s ease forwards; opacity: 0.32; }
      }
      /* Degraded mode already drains the canvas to grey; the watermark is not
         part of that story and steps further back rather than competing with
         the banner that is. */
      body.degraded .update-mark.on { opacity: 0.16; }
      .rail-spark { display: block; width: 100%; height: 1.4vh; overflow: visible; }
      .rail-spark polyline {
        fill: none; stroke: #ed795399; stroke-width: 1;
        stroke-linejoin: round; stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/"
        }
      }
    </script>
  </head>
  <body>
    <div id="degraded" role="status"></div>
    <div id="stage"><canvas id="scene"></canvas></div>
    <!-- Populated only when ?rail=1 asks for it; otherwise it stays empty and
         display:none, and js/rail.js never polls. -->
    <aside id="rail"></aside>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
